name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 * * *' # Jalan tiap jam 00:00 UTC setiap hari
  workflow_dispatch: # Biar lu bisa ngetes script ini secara manual

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          curl -sSf -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/modules?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" 